name: Publish approved release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix; must match all application manifests
        required: true
        type: string
      release_tier:
        description: Only the disclosed unsigned GitHub community tier is enabled; signed distribution remains disabled
        required: true
        default: community
        type: choice
        options:
          - community
      candidate_run_id:
        description: Successful Candidate workflow run ID
        required: true
        type: string
      candidate_commit:
        description: Exact binary-source commit from the successful Candidate workflow
        required: true
        type: string
      release_commit:
        description: Exact final documentation/governance commit to tag; only the reviewed allowlisted delta from Candidate is accepted
        required: true
        type: string
      windows_sha256:
        description: SHA-256 from the Windows Candidate manifest; this is not installed-package validation
        required: true
        type: string
      windows_beta_acknowledgement:
        description: Enter WINDOWS_BETA_UNVALIDATED; no Windows GUI or downgrade evidence is claimed
        required: true
        type: string
      macos_sha256:
        description: SHA-256 recorded during the macOS installed-package validation
        required: true
        type: string
      macos_validated_at:
        description: macOS validation time in ISO-8601 UTC form
        required: true
        type: string
      macos_evidence_url:
        description: HTTPS URL to durable macOS validation evidence
        required: true
        type: string
      previous_release_tag:
        description: Previous public release tag, or none only for the first public release
        required: true
        type: string
      macos_rollback_evidence_url:
        description: HTTPS evidence of macOS downgrade to the previous release, or none for the first public release
        required: true
        type: string
      release_notes_path:
        description: Reviewed release notes under docs/releases/
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify approved candidate and publish once
    runs-on: ubuntu-24.04
    environment: production-release
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm
      - name: Validate immutable inputs and source version
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_NOTES_PATH: ${{ inputs.release_notes_path }}
          RELEASE_TIER: ${{ inputs.release_tier }}
        run: |
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"
          node scripts/validate-release-request.mjs \
            --version "$VERSION" \
            --commit "$RELEASE_COMMIT" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --release-tier "$RELEASE_TIER" \
            --notes "$RELEASE_NOTES_PATH"
          npm run version:check -- --tag "v$VERSION"
          node scripts/check-release-governance.mjs
      - name: Verify candidate workflow identity and result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .path)" = ".github/workflows/candidate.yml"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$CANDIDATE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = "success"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Refusing to reuse or replace existing tag v$VERSION" >&2
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to reuse or replace existing Release v$VERSION" >&2
            exit 1
          fi
      - name: Verify previous public release and downgrade gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
        run: |
          if test "$VERSION" = "0.2.1"; then
            test "$PREVIOUS_RELEASE_TAG" = "none"
          else
            test "$(gh release view "$PREVIOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
            mkdir previous-release
            gh release download "$PREVIOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir previous-release
            test -f previous-release/SHA256SUMS.txt
            test -n "$(find previous-release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) -print -quit)"
            cd previous-release
            sha256sum --check SHA256SUMS.txt
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quota-assistant-candidate-*
          path: release-input
          merge-multiple: true
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate manifests, platform evidence and checksums
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          WINDOWS_SHA256: ${{ inputs.windows_sha256 }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          WINDOWS_BETA_ACKNOWLEDGEMENT: ${{ inputs.windows_beta_acknowledgement }}
          MACOS_SHA256: ${{ inputs.macos_sha256 }}
          MACOS_VALIDATED_AT: ${{ inputs.macos_validated_at }}
          MACOS_EVIDENCE_URL: ${{ inputs.macos_evidence_url }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
          MACOS_ROLLBACK_EVIDENCE_URL: ${{ inputs.macos_rollback_evidence_url }}
          RELEASE_TIER: ${{ inputs.release_tier }}
        run: |
          node scripts/verify-release-candidate.mjs \
            --input release-input \
            --output release-assets \
            --version "$VERSION" \
            --commit "$CANDIDATE_COMMIT" \
            --release-commit "$RELEASE_COMMIT" \
            --release-tier "$RELEASE_TIER" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --windows-sha256 "$WINDOWS_SHA256" \
            --windows-beta-acknowledgement "$WINDOWS_BETA_ACKNOWLEDGEMENT" \
            --macos-sha256 "$MACOS_SHA256" \
            --macos-validated-at "$MACOS_VALIDATED_AT" \
            --macos-evidence-url "$MACOS_EVIDENCE_URL" \
            --previous-release-tag "$PREVIOUS_RELEASE_TAG" \
            --macos-rollback-evidence-url "$MACOS_ROLLBACK_EVIDENCE_URL"
      - name: Verify GitHub artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in release-assets/quota-assistant_*; do
            case "$file" in
              *.exe|*.dmg|*.cdx.json|*.manifest.json) gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" ;;
            esac
          done
      - name: Create exactly one immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_NOTES_PATH: ${{ inputs.release_notes_path }}
        run: >-
          gh release create "v$VERSION"
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --target "$RELEASE_COMMIT"
          --title "额度助手 v$VERSION"
          --notes-file "$RELEASE_NOTES_PATH"
